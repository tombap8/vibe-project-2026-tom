<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 | Discovery Expedition</title>
    <meta name="description" content="디스커버리 익스페디션 회원으로 가입하세요.">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/notice.css">
    <script type="module" src="../js/modules/auth-page.js"></script>
  </head>
  <body class="notice-site auth-page">
    <a class="visually-hidden notice-skip-link" href="#main-content">본문 바로가기</a>
    <div data-site-header-slot></div>

    <main id="main-content">
      <section class="outer-box notice-page" aria-labelledby="auth-page-title">
        <div class="inner-box">
          <div class="part-box notice-page__layout auth-page__content">
            <nav class="notice-breadcrumb" aria-label="현재 위치">
              <a href="../index.html">홈</a>
              <span aria-hidden="true">&gt;</span>
              <a href="./login.html">로그인</a>
              <span aria-hidden="true">&gt;</span>
              <span aria-current="page">회원가입</span>
            </nav>
            <header class="notice-page__heading">
              <p>MEMBERSHIP</p>
              <h1 id="auth-page-title">회원가입</h1>
              <p>아래 정보를 입력해 계정을 만들어 주세요.</p>
            </header>

            <section class="auth-page__section" aria-labelledby="signup-title">
              <h2 id="signup-title">회원 정보 입력</h2>
              <form class="notice-form" data-js="signup-form">
                <div class="notice-form__row">
                  <label class="notice-form__label" for="signup-name">이름</label>
                  <div class="notice-form__field">
                    <input class="notice-form__input" id="signup-name" name="name" type="text" autocomplete="name" maxlength="40" required>
                  </div>
                </div>
                <div class="notice-form__row">
                  <label class="notice-form__label" for="signup-username">아이디</label>
                  <div class="notice-form__field">
                    <div class="auth-page__username-row">
                      <input class="notice-form__input" id="signup-username" name="username" type="text" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9._-]{3,20}" aria-describedby="username-status" required>
                      <button class="auth-page__check-button" data-js="check-username" type="button">중복확인</button>
                    </div>
                    <p class="auth-page__message" id="username-status" data-js="username-status" role="status" aria-live="polite"></p>
                  </div>
                </div>
                <div class="notice-form__row">
                  <label class="notice-form__label" for="signup-password">비밀번호</label>
                  <div class="notice-form__field">
                    <input class="notice-form__input" id="signup-password" name="password" type="password" autocomplete="new-password" minlength="6" required>
                    <span class="notice-form__help">6자 이상 입력해 주세요.</span>
                  </div>
                </div>
                <div class="notice-form__row">
                  <label class="notice-form__label" for="signup-email">이메일</label>
                  <div class="notice-form__field">
                    <input class="notice-form__input" id="signup-email" name="email" type="email" autocomplete="email" required>
                  </div>
                </div>
                <div class="notice-form__field">
                  <p class="auth-page__message" data-js="signup-error" role="alert"></p>
                  <div class="notice-form__actions">
                    <button class="notice-button notice-button--primary" type="submit">회원가입</button>
                  </div>
                </div>
              </form>
            </section>
            <p class="auth-page__switch">이미 계정이 있으신가요? <a data-js="login-link" href="./login.html">로그인</a></p>
          </div>
        </div>
      </section>
    </main>
    <div data-site-footer></div>
  </body>
</html>
