<!doctype html>
<html lang="ko" class="shop-document">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>장바구니 | Discovery Expedition</title>
    <meta name="description" content="장바구니에 담은 디스커버리 익스페디션 상품을 확인하세요.">
    <link rel="stylesheet" href="../css/main.css">
    <script type="module" src="../js/modules/shop-page.js"></script>
  </head>
  <body class="shop-page" data-shop-page="cart">
    <div data-site-header-slot></div>

    <main id="main-content">
      <p class="shop-status" data-js="shop-status" role="status" aria-live="polite"></p>
      <section class="outer-box shop-page__section" aria-labelledby="cart-page-title">
        <div class="inner-box">
          <header class="shop-page__heading">
            <p class="shop-page__eyebrow">SHOPPING</p>
            <h1 id="cart-page-title">장바구니</h1>
          </header>
          <div class="part-box cart-layout">
            <section class="cart-layout__items" aria-label="장바구니 상품 목록" data-js="cart-items" aria-live="polite">
              <p class="cart-empty">장바구니를 불러오고 있습니다.</p>
            </section>
            <aside class="cart-summary" aria-labelledby="cart-summary-title">
              <h2 id="cart-summary-title">결제정보</h2>
              <div class="cart-summary__row">
                <span>상품 금액</span>
                <strong data-js="cart-total">0원</strong>
              </div>
              <div class="cart-summary__row">
                <span>배송비</span>
                <span>무료배송</span>
              </div>
              <div class="cart-summary__total">
                <strong>총 결제금액</strong>
                <strong data-js="cart-total">0원</strong>
              </div>
              <button class="shop-button" type="button" disabled>주문하기</button>
            </aside>
          </div>
        </div>
      </section>
    </main>
      <div data-site-footer></div>
  </body>
</html>
