<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discovery Expedition | 공식 온라인몰</title>
    <meta name="description" content="디스커버리 익스페디션의 액티브한 라이프스타일과 겨울 컬렉션을 만나보세요.">
    <link rel="stylesheet" href="./css/main.css">
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <header class="outer-box outer-box--header">
      <div class="inner-box">
        <div class="part-box part-box--between header__content">
          <a class="brand" href="#hero" aria-label="Discovery Expedition 홈">
            <img src="./images/used/main-logo.svg" alt="">
          </a>

          <nav class="header__navigation" aria-label="상품 카테고리">
            <ul class="part-box part-box--nowrap header__categories">
              <li><span class="header__category header__category--active" aria-current="page">여성</span></li>
              <li><span class="header__category">남성</span></li>
              <li><span class="header__category">신발</span></li>
              <li><span class="header__category">용품</span></li>
              <li><span class="header__category">키즈</span></li>
            </ul>
          </nav>

          <div class="part-box header__actions" aria-label="쇼핑 메뉴">
            <button class="icon-button" type="button" aria-label="검색">
              <img src="./images/used/search_icon_white_size28.21536056.svg" alt="">
            </button>
            <button class="icon-button" type="button" aria-label="장바구니">
              <img src="./images/used/cart_icon_white_size28.2a67abe7.svg" alt="">
            </button>
            <button class="icon-button" type="button" aria-label="마이페이지">
              <img src="./images/used/mypage_icon_white_size28.ecf13ebe.svg" alt="">
            </button>
            <button class="icon-button icon-button--menu" type="button" aria-label="전체 메뉴" aria-expanded="false" aria-controls="full-menu">
              <img src="./images/used/menu_icon_white_size28.fd4f622b.svg" alt="">
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="main-content">
      <section class="outer-box outer-box--bleed hero" id="hero" aria-labelledby="hero-title">
        <div class="inner-box hero__inner">
          <div class="part-box hero__stage">
            <div class="hero__image" aria-hidden="true"></div>
            <div class="hero__copy">
              <h1 class="hero__title" id="hero-title">
                <span>DISCOVER</span>
                <span>MY ACTIVE WINTER</span>
              </h1>
              <p class="hero__description">프리미엄 에센셜 다운과 윈터 슈즈가 만드는 균형 잡힌 비율</p>
            </div>
            <div class="hero__pagination" role="group" aria-label="프로모션 슬라이드 1">
              <span class="hero__pagination-item hero__pagination-item--active"></span>
              <span class="hero__pagination-item"></span>
              <span class="hero__pagination-item"></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <section class="full-menu" id="full-menu" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="full-menu-title" hidden inert data-state="closed">
      <div class="full-menu__panel">
        <div class="full-menu__scroll">
          <div class="full-menu__tabs">
            <h2 class="visually-hidden" id="full-menu-title">전체 메뉴</h2>
            <div class="full-menu__tablist" role="tablist" aria-label="상품 분류">
              <button class="full-menu__tab full-menu__tab--active" id="full-menu-tab-women" type="button" role="tab" aria-selected="true" aria-controls="full-menu-content" data-category="여성">여성</button>
              <button class="full-menu__tab" id="full-menu-tab-men" type="button" role="tab" aria-selected="false" aria-controls="full-menu-content" tabindex="-1" data-category="남성">남성</button>
              <button class="full-menu__tab" id="full-menu-tab-shoes" type="button" role="tab" aria-selected="false" aria-controls="full-menu-content" tabindex="-1" data-category="신발">신발</button>
              <button class="full-menu__tab" id="full-menu-tab-gear" type="button" role="tab" aria-selected="false" aria-controls="full-menu-content" tabindex="-1" data-category="용품">용품</button>
              <button class="full-menu__tab" id="full-menu-tab-kids" type="button" role="tab" aria-selected="false" aria-controls="full-menu-content" tabindex="-1" data-category="키즈">키즈</button>
              <button class="full-menu__tab" id="full-menu-tab-outlet" type="button" role="tab" aria-selected="false" aria-controls="full-menu-content" tabindex="-1" data-category="아울렛">아울렛</button>
            </div>
            <button class="full-menu__close" type="button" aria-label="전체 메뉴 닫기">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="m6 6 12 12M18 6 6 18"></path>
              </svg>
            </button>
          </div>
          <div class="full-menu__content" id="full-menu-content" role="tabpanel" aria-labelledby="full-menu-tab-women" tabindex="0"></div>
        </div>
      </div>
    </section>

    <aside class="floating-actions" aria-label="빠른 메뉴">
      <button class="floating-actions__button" type="button" aria-label="채팅 문의">
        <img src="./images/used/floating-btn-chat.svg" alt="">
      </button>
      <button class="floating-actions__button" type="button" aria-label="최근 본 상품">
        <img src="./images/used/floating-btn-recently-viewed-products.5d30f3d5.svg" alt="">
      </button>
    </aside>

    <nav class="tabbar" aria-label="모바일 빠른 메뉴">
      <button class="tabbar__item tabbar__item--category" type="button" aria-label="카테고리" aria-expanded="false" aria-controls="full-menu">
        <img class="tabbar__menu-icon" src="./images/used/menu_icon_white_size28.fd4f622b.svg" alt="">
        <svg class="tabbar__close-icon" aria-hidden="true" viewBox="0 0 24 24">
          <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
        <span>카테고리</span>
      </button>
      <button class="tabbar__item" type="button" aria-label="검색">
        <img src="./images/used/search_icon_white_size28.21536056.svg" alt="">
        <span>검색</span>
      </button>
      <a class="tabbar__item tabbar__item--home" href="#hero" aria-label="홈" aria-current="page">
        <img src="./images/used/main-logo.svg" alt="">
        <span>홈</span>
      </a>
      <button class="tabbar__item" type="button" aria-label="장바구니">
        <img src="./images/used/cart_icon_white_size28.2a67abe7.svg" alt="">
        <span>장바구니</span>
      </button>
      <button class="tabbar__item" type="button" aria-label="마이페이지">
        <img src="./images/used/mypage_icon_white_size28.ecf13ebe.svg" alt="">
        <span>마이</span>
      </button>
    </nav>
  </body>
</html>
